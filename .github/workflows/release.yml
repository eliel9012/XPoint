name: Compile Release

# Builds every board's release firmware on tag push and publishes each .bin under
# BOTH names during the OTA asset-name transition:
#   xpoint-<version>-<device>.bin        (current name)
#   crosspoint-<version>-<device>.bin    (compatibility name for v1.15.x OTA)
# (the combined C3 X4/X3 binary uses device tag x3-x4). It then creates a draft
# GitHub Release, attaches all build artifacts, and generates + signs a per-board
# manifest.json (Ed25519) so the device can verify OTA authenticity.
#
# Easy OTA trigger:
#   1. Bump the version in platformio.ini (crosspoint.version) and commit to develop.
#   2. Push a tag:  git tag -s v1.2.3 -m "Release v1.2.3" && git push origin v1.2.3
#      (any tag triggers this workflow). The release is created as a DRAFT — publish it
#      from the GitHub UI (or set make_latest / draft:false below) and devices will see it.
#
# Signing: the Ed25519 private key lives in the repo secret OTA_SIGNING_KEY (raw 32-byte
# seed, base64). The matching public key is baked into the firmware at lib/OtaSignature/
# ota_pubkey.h. Rotate both together (see docs/OTA_SIGNING.md).

on:
  push:
    tags:
      - '*'

# Cap the PlatformIO Core version the platform's penv bootstrap may install
# (see .github/pio-constraints.txt). UV_CONSTRAINT reaches the penv's uv pip
# install; PIP_CONSTRAINT covers the pip fallback path.
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            device: x3-x4
          - pio_env: sticky-gh_release
            device: sticky
          - pio_env: x4pro-gh_release
            device: x4pro
          - pio_env: papermono-gh_release
            device: papermono
          - pio_env: x4c-gh_release
            device: x4c
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate release version
        id: validate_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          version=""

          # Stable releases use v<version> (or the bare version). The existing
          # Portuguese X4 Pro distribution tags use
          # ptbr-x4pro-<version>-<distribution-build>; validate the embedded
          # firmware version but keep the full tag for release asset naming.
          if [[ "$RELEASE_TAG" == "v${configured_version}" || "$RELEASE_TAG" == "$configured_version" ]]; then
            version="$configured_version"
          elif [[ "$RELEASE_TAG" =~ ^ptbr-x4pro-([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Unsupported release tag format: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$version" != "$configured_version" ]]; then
            echo "Release tag embeds version $version, but platformio.ini declares $configured_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The PT-BR profile predates a dedicated release section in platformio.ini.
      # Select it only for ptbr-x4pro tags and add the release-specific defines
      # at build time; the profile itself supplies the X4 Pro hardware and PT-BR
      # language configuration. Generic tags retain the existing matrix envs.
      - name: Select release build profile
        id: select_build
        env:
          MATRIX_ENV: ${{ matrix.pio_env }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build_env="$MATRIX_ENV"
          if [[ "$MATRIX_ENV" == "x4pro-gh_release" && "$RELEASE_TAG" == ptbr-x4pro-* ]]; then
            build_env="x4pro-ptbr"
          fi
          echo "pio_env=$build_env" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ steps.select_build.outputs.pio_env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ steps.select_build.outputs.pio_env }}-
            pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ steps.select_build.outputs.pio_env }} -j1

      - name: Prepare firmware assets
        id: asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.validate_version.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          crosspoint_asset="crosspoint-${version}-${{ matrix.device }}.bin"
          xpoint_asset="xpoint-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${{ steps.select_build.outputs.pio_env }}/firmware.bin" \
            ".pio/build/${{ steps.select_build.outputs.pio_env }}/${crosspoint_asset}"
          cp ".pio/build/${{ steps.select_build.outputs.pio_env }}/firmware.bin" \
            ".pio/build/${{ steps.select_build.outputs.pio_env }}/${xpoint_asset}"
          echo "crosspoint_name=$crosspoint_asset" >> "$GITHUB_OUTPUT"
          echo "xpoint_name=$xpoint_asset" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.crosspoint_name }}
          path: |
            .pio/build/${{ steps.select_build.outputs.pio_env }}/bootloader.bin
            .pio/build/${{ steps.select_build.outputs.pio_env }}/${{ steps.asset.outputs.crosspoint_name }}
            .pio/build/${{ steps.select_build.outputs.pio_env }}/${{ steps.asset.outputs.xpoint_name }}
            .pio/build/${{ steps.select_build.outputs.pio_env }}/firmware.elf
            .pio/build/${{ steps.select_build.outputs.pio_env }}/firmware.map
            .pio/build/${{ steps.select_build.outputs.pio_env }}/partitions.bin

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the release + attaches assets
    steps:
      - name: Checkout repo
        # publish-release needs a .git so `gh release create` can resolve the
        # repo/branch; download-artifact alone leaves no working tree.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install manifest signing dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography>=45.0.3'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        id: collect
        run: |
          mkdir -p dist
          # Each artifact carries one crosspoint-*.bin and one identical
          # xpoint-*.bin. Search for actual *files* recursively and never match a
          # directory (a directory match made `cp` fail with "omitting directory").
          for d in artifacts/*/; do
            while IFS= read -r bin; do
              cp "$bin" "dist/$(basename "$bin")"
            done < <(find "$d" -type f \( -name 'crosspoint-*.bin' -o -name 'xpoint-*.bin' \))
          done
          ls -la dist
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate + sign manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            echo "::error::OTA_SIGNING_KEY is not configured; refusing to create an unsigned release."
            exit 1
          fi
          python3 - <<'PY'
          import base64, binascii, hashlib, json, os, re
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization

          dist = "dist"
          # The secret must match the public key already trusted by devices.
          # Never print the seed or derived key in CI logs.
          with open("lib/OtaSignature/ota_pubkey.h") as f:
              header = f.read()
          match = re.search(r"PUBKEY\[PUBKEY_LEN\]\s*=\s*\{([^}]*)\}", header, re.S)
          if not match:
              raise SystemExit("Cannot read the firmware OTA public key")
          trusted_key = bytes(int(value, 16) for value in re.findall(r"0x[0-9A-Fa-f]{2}", match.group(1)))
          if len(trusted_key) != 32:
              raise SystemExit("Firmware OTA public key must be 32 bytes")
          try:
              seed = base64.b64decode(os.environ["OTA_SIGNING_KEY"], validate=True)
              key = Ed25519PrivateKey.from_private_bytes(seed)
          except (binascii.Error, ValueError):
              raise SystemExit("OTA_SIGNING_KEY must be a base64-encoded 32-byte Ed25519 seed") from None
          public_key = key.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          if public_key != trusted_key:
              raise SystemExit("OTA_SIGNING_KEY does not match the public key trusted by firmware")

          # Asset device tag -> manifest board name (matches FirmwareBoardTag.cpp).
          # The combined C3 X4/X3 image is one compatibility class, tagged x4.
          device_board = {
              "x3-x4": "x4",
              "sticky": "sticky",
              "x4pro": "x4pro",
              "papermono": "papermono",
              "x4c": "x4c",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          version_match = re.search(r"\d+\.\d+\.\d+", tag)
          if not version_match:
              raise SystemExit(f"Cannot extract firmware version from tag: {tag}")
          version = version_match.group(0)
          # Sign both asset families. Crosspoint entries MUST come first:
          # v1.15.x devices parse at most 8 entries and return the first match
          # for their board, so they must encounter the crosspoint URL before
          # the duplicate xpoint entry. Newer devices select the entry whose
          # URL matches the xpoint asset they found in the release JSON.
          families = (
              ("crosspoint", f"crosspoint-{version}-"),
              ("xpoint", f"xpoint-{version}-"),
          )
          expected_assets = [
              f"{family}-{version}-{device}.bin"
              for family, _ in families for device in device_board
          ]
          missing_assets = [name for name in expected_assets if not os.path.isfile(os.path.join(dist, name))]
          if missing_assets:
              raise SystemExit("Missing firmware assets: " + ", ".join(missing_assets))
          empty_assets = [name for name in expected_assets if not os.path.getsize(os.path.join(dist, name))]
          if empty_assets:
              raise SystemExit("Empty firmware assets: " + ", ".join(empty_assets))
          repo = os.environ["GITHUB_REPOSITORY"]
          boards = []
          for family, prefix in families:
              for device, board in device_board.items():
                  name = f"{prefix}{device}.bin"
                  path = os.path.join(dist, name)
                  with open(path, "rb") as f:
                      data = f.read()
                  sha = hashlib.sha256(data).hexdigest()
                  # Resolve the published asset URL on the (draft) release.
                  url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
                  boards.append({
                      "board": board,
                      "url": url,
                      "size": len(data),
                      "sha256": sha,
                  })
          manifest = {
              "version": version,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "boards": boards,
          }
          text = json.dumps(manifest, indent=2, sort_keys=True)
          # Sign the EXACT bytes we write to disk. The device verifies the
          # downloaded file body, so the signature must cover the same bytes
          # (including the trailing newline) or verification fails.
          body = text + "\n"
          if len(body.encode("utf-8")) > 4096:
              raise SystemExit("OTA manifest exceeds the device's 4096-byte limit")
          with open(os.path.join(dist, "manifest.json"), "w") as f:
              f.write(body)

          # Sign the exact manifest bytes with the Ed25519 private key (raw 32-byte seed).
          sig = key.sign(body.encode("utf-8"))
          with open(os.path.join(dist, "manifest.json.sig"), "wb") as f:
              f.write(base64.b64encode(sig))
          print("manifest signed for", len(boards), "boards")
          PY

      - name: Generate release notes
        run: |
          set -euo pipefail
          # Previous tag = closest tag reachable from the release tag's parent
          # commit. `git describe --abbrev=0 <ref>^` only walks REACHABLE tags,
          # so the stray ancient pre-OTA tags (e.g. 1.6.0rc, not ancestors of
          # develop) can never be picked as the changelog base.
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          notes=dist/NOTES.md
          {
            echo "Personal fork release. See README fork notice."
            echo "OTA manifest signed (Ed25519); verify before flashing."
          } > "$notes"
          if [ -n "$prev_tag" ]; then
            echo "" >> "$notes"
            python3 scripts/generate_changelog.py "${prev_tag}..${GITHUB_REF_NAME}" --pr-links >> "$notes"
            echo "notes range: ${prev_tag}..${GITHUB_REF_NAME}"
          else
            echo "notes: no previous tag reachable; keeping static notice only"
          fi
          cat "$notes"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a DRAFT release so a human reviews assets before going live.
          # Flip `--draft` to `--latest` (or add `--latest`) to auto-publish.
          set -euo pipefail
          tag="${{ steps.collect.outputs.tag }}"
          shopt -s nullglob
          assets=(dist/crosspoint-*.bin dist/xpoint-*.bin)
          test -s dist/manifest.json
          test -s dist/manifest.json.sig
          assets+=(dist/manifest.json dist/manifest.json.sig)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Reruns must update existing draft instead of failing on duplicate tag.
            gh release edit "$tag" \
              --draft \
              --title "XPoint $tag" \
              --notes-file dist/NOTES.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --draft \
              --title "XPoint $tag" \
              --notes-file dist/NOTES.md \
              "${assets[@]}"
          fi
